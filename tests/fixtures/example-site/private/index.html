<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Private area</title>
  <meta name="description" content="A page robots.txt disallows.">
  <link rel="canonical" href="https://localhost/private/">
</head>
<body>
  <h1>Private area</h1>
  <p>This page exists in the build and is named in the sitemap, but robots.txt disallows it.
  The live crawl records it as skipped rather than fetching it; the local crawl reads the file,
  because there is no request to disallow.</p>
</body>
</html>
