<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Services</title>
  <meta name="description" content="What the example site offers.">
  <link rel="canonical" href="https://example.org/services/">
  <script type="application/ld+json">
  {"@context": "https://schema.org", "@type": "Service", "name": "Example service"}
  </script>
</head>
<body>
  <h1>Services</h1>
  <p>This page declares a canonical on another host, which is the finding canonical_other_host.
  It also carries a JSON-LD Service entity, so the site-wide type count has two types in it.</p>
  <p><a href="/">Home</a> and <a href="/broken/">a link that returns nothing</a>.</p>
</body>
</html>
